name: "RIKA stove GSM emulator"
description: >-
  Pretends to be the GSM modem a RIKA stove was built for. Keeps the stove's
  GSM function alive and takes commands from Home Assistant.
version: "1.0.0"
slug: "rika_gsm"
init: false
arch:
  - aarch64
  - amd64
# services, not application: the add-on must be up before Home Assistant
# starts sending, and it must start on boot. If it stops, the stove forgets
# its modem after half a minute, and only someone at the keypad can bring it
# back.
startup: services
boot: auto
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: "Command interface for Home Assistant (POST /command)"
# Write access to /share: the state file lives there, and Home Assistant
# reads it with a command_line sensor.
map:
  - share:rw
options:
  host: "192.168.1.100"
  port: 8899
  pin: "0000"
  phone: "++436641234567"
  http_port: 8098
  state_file: "/share/rika/state.json"
schema:
  host: str
  port: int
  # The four-digit receive code from the stove menu, SETUP -> CODE.
  pin: match(^[0-9]{4}$)
  # The number the stove should store as the sender. No SMS is ever sent -
  # it only wants one on file, otherwise it will not report faults by itself.
  #
  # THE LEADING CHARACTER IS SACRIFICED. The stove drops the first character
  # when storing:
  #     sent "+436641234567"  ->  stored "436641234567"
  #     sent  "06641234567"   ->  stored  "6641234567"
  # Without a leading plus it treats the number as incomplete and appends
  # "PLEASE SAVE TEL NUMBER" to every reply. A doubled plus lands exactly one.
  phone: str
  http_port: int
  state_file: str
