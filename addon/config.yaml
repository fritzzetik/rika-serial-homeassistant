name: "RIKA stove GSM emulator"
description: >-
  Gibt sich dem RIKA Como dauerhaft als GSM-Modem aus, haelt dessen
  GSM-Funktion wach und nimmt Befehle von Home Assistant entgegen.
version: "1.0.0"
slug: "rika_gsm"
init: false
arch:
  - aarch64
  - amd64
# services, nicht application: Der Dienst muss stehen, bevor Home Assistant
# seine Befehle schickt - und er soll beim Hochfahren von selbst starten.
# Faellt er aus, vergisst der Ofen nach einer halben Minute sein Modem, und
# das holt nur noch jemand vor Ort am Tastendisplay zurueck.
startup: services
boot: auto
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: "Befehlsschnittstelle fuer Home Assistant (POST /befehl)"
# Schreibrecht auf /share: Dort liegt der Zustand als JSON, den Home
# Assistant mit command_line-Sensoren liest - dasselbe Muster wie beim
# RTR-Netztest.
map:
  - share:rw
options:
  host: "192.168.1.100"
  port: 8899
  pin: "0000"
  phone: "++430000000000"
  http_port: 8098
  state_file: "/share/rika/state.json"
schema:
  host: str
  port: int
  # Der vierstellige Empfangscode aus dem Ofenmenue, SETUP -> CODE.
  pin: match(^[0-9]{4}$)
  # Die Nummer, die der Ofen als Absender speichern soll. Es wird keine SMS
  # verschickt - er will nur eine hinterlegt haben, sonst meldet er Fehler
  # nicht von selbst.
  #
  # DAS FUEHRENDE ZEICHEN WIRD GEOPFERT. Der Como schneidet beim Speichern
  # blind das erste Zeichen ab, gemessen am 03.10.2026:
  #     gesendet "+436641234567"  ->  gespeichert "436641234567"
  #     gesendet  "06641234567"   ->  gespeichert  "6641234567"
  # Ohne fuehrendes Plus haelt er die Nummer fuer unvollstaendig und haengt
  # "PLEASE SAVE TEL NUMBER" an jede Antwort. Mit doppeltem Plus kommt genau
  # eines an, und der Hinweis verschwindet.
  phone: str
  http_port: int
  state_file: str
