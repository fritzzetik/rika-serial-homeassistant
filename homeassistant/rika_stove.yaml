# RIKA pellet stove (keypad-display generation) in Home Assistant.
#
# Companion to the "RIKA stove GSM emulator" add-on. See README.md.
#
# BEFORE YOU USE THIS
#   - point notify.mobile_app_your_phone at your own device
#   - check the URL below: it must reach the add-on's http_port
#   - RESTART Home Assistant after copying this file. `reload_all` does not
#     load rest_command, and the buttons will silently do nothing.
#
# WHY THERE IS NO STATE SENSOR
#   This stove generation has no status query. What you see is always the
#   LAST MESSAGE, never the current state. Add a power meter on the stove's
#   plug to know whether it is actually burning.

command_line:
  - sensor:
      name: "RIKA stove message"
      unique_id: rika_stove_message
      command: "cat /share/rika/state.json"
      # The add-on rewrites the file on every message and otherwise every
      # five seconds, so polling faster than this buys nothing.
      scan_interval: 30
      value_template: >-
        {{ (value_json.last_message | default('no message', true))[:250] }}
      json_attributes:
        - gsm_active
        - last_message_time
        - last_command
        - queued
        - updated

template:
  - binary_sensor:
      # Off means the stove has lost its modem. Only someone at the keypad
      # can bring it back: MENU -> SETUP -> GSM SET -> GSM ON. The add-on
      # prevents this by answering around the clock.
      - name: "RIKA stove GSM"
        unique_id: rika_stove_gsm
        device_class: connectivity
        state: >-
          {{ state_attr('sensor.rika_stove_message', 'gsm_active') | default(false, true) }}
        availability: >-
          {{ states('sensor.rika_stove_message') not in ['unknown', 'unavailable'] }}

      # FAILURE is a fault. WARNING is a warning, and per the manual the
      # stove only ever attaches those to a reply.
      - name: "RIKA stove fault"
        unique_id: rika_stove_fault
        device_class: problem
        state: >-
          {{ states('sensor.rika_stove_message').startswith('FAILURE') }}
        availability: >-
          {{ states('sensor.rika_stove_message') not in ['unknown', 'unavailable'] }}

input_number:
  # The manual: room setpoints below 14 °C cannot be selected. The upper
  # bound is arbitrary, but a pellet stove asked for 30 °C is nearly always
  # a typo.
  rika_stove_setpoint:
    name: "RIKA stove setpoint"
    min: 14
    max: 28
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    mode: slider

rest_command:
  # Takes the command WITHOUT the receive code - the add-on prepends it, so
  # the code never appears in your configuration.
  rika_stove_command:
    url: "http://homeassistant.local:8098/command"
    method: POST
    content_type: "application/json"
    payload: '{"command": "{{ command }}"}'
    timeout: 10

script:
  rika_stove_off:
    alias: "RIKA stove off"
    icon: mdi:fire-off
    sequence:
      - action: rest_command.rika_stove_command
        data:
          command: "OFF"

  # Everything below LIGHTS A FIRE. In the dashboard each of these carries a
  # confirmation; switching off does not. Friction belongs where the wrong
  # tap is expensive.
  rika_stove_on:
    alias: "RIKA stove on"
    icon: mdi:fire
    sequence:
      - action: rest_command.rika_stove_command
        data:
          command: "ON"

  rika_stove_power_30:
    alias: "RIKA stove 30 %"
    icon: mdi:fire-alert
    sequence:
      - action: rest_command.rika_stove_command
        data:
          command: "h30"

  rika_stove_power_60:
    alias: "RIKA stove 60 %"
    icon: mdi:fire-alert
    sequence:
      - action: rest_command.rika_stove_command
        data:
          command: "h60"

  rika_stove_power_100:
    alias: "RIKA stove 100 %"
    icon: mdi:fire-alert
    sequence:
      - action: rest_command.rika_stove_command
        data:
          command: "h100"

  # Needs the RIKA room sensor on pins 4 and 5. Without it the stove
  # answers "FAILURE: text Error" - which does not mean the command is
  # unknown, only that a prerequisite is missing.
  rika_stove_room_temperature:
    alias: "RIKA stove: hold room temperature"
    icon: mdi:home-thermometer
    sequence:
      - action: rest_command.rika_stove_command
        data:
          command: >-
            r{{ states('input_number.rika_stove_setpoint') | int(21) }}

  # Normally unnecessary: the add-on stores the number by itself after every
  # stove re-init. Kept as a manual handle.
  rika_stove_save_number:
    alias: "RIKA stove: store phone number"
    icon: mdi:phone-plus
    sequence:
      - action: rest_command.rika_stove_command
        data:
          command: "TEL"

automation:
  - id: rika_stove_notify
    alias: "RIKA stove: message to phone"
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: sensor.rika_stove_message
    conditions:
      # Nothing on startup or when the add-on was briefly away.
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.from_state.state != trigger.to_state.state }}
      # The add-on stores the phone number by itself after every re-init.
      # Reporting that would be noise.
      - condition: template
        value_template: "{{ 'TELEPHONE NUMBER' not in trigger.to_state.state }}"
    actions:
      - action: notify.mobile_app_your_phone
        data:
          title: >-
            {{ 'RIKA stove: fault' if trigger.to_state.state.startswith('FAILURE')
               else ('RIKA stove: warning' if trigger.to_state.state.startswith('WARNING')
               else 'RIKA stove') }}
          message: "{{ trigger.to_state.state }}"
          data:
            # A fault should get through the night.
            push:
              interruption-level: >-
                {{ 'time-sensitive' if trigger.to_state.state.startswith('FAILURE')
                   else 'active' }}
